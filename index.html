<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NONA RA - Premium Link</title>
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(-45deg, #09090b, #18181b, #121214, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           LAYAR WELCOME (TAP ANYWHERE)
           ========================================= */
        #welcomeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050505; /* Warna gelap solid */
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: floatCard 3s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome-pic {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 16px; /* Dibuat agak kotak seperti di screenshot */
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .welcome-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .welcome-tap {
            font-size: 11px;
            color: #888;
            letter-spacing: 3px;
            animation: blinkText 1.5s infinite;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        @keyframes blinkText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* =========================================
           ANIMASI HALAMAN UTAMA
           ========================================= */
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideRight {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .animate-item {
            opacity: 0; 
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 1;
        }

        .animate-text {
            opacity: 0;
            animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: block;
        }

        /* Delay Animations */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }
        .delay-5 { animation-delay: 0.8s; }
        .delay-6 { animation-delay: 0.9s; }

        .t-delay-1 { animation-delay: 0.5s; }
        .t-delay-2 { animation-delay: 0.6s; }
        .t-delay-3 { animation-delay: 0.8s; }
        .t-delay-4 { animation-delay: 0.9s; }
        .t-delay-5 { animation-delay: 1.0s; }
        .t-delay-6 { animation-delay: 1.2s; }
        .t-delay-7 { animation-delay: 1.3s; }
        .t-delay-8 { animation-delay: 1.4s; }
        .t-delay-9 { animation-delay: 1.5s; }

        /* =========================================
           STYLING HALAMAN UTAMA
           ========================================= */
        .main-wrapper {
            width: 100%;
            display: none; /* Disembunyikan awalnya */
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px; 
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        /* Ikon Audio Kanan Atas */
        .top-right-icon {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7bb5d6;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .top-right-icon:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) rotate(5deg);
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            text-align: center;
        }

        .profile-pic-main {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 30px rgba(123, 181, 214, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.15);
            padding: 3px;
        }

        .profile-name {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .profile-desc {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .social-icons {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-icons a {
            color: #ffffff;
            font-size: 22px;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            color: #7bb5d6;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            width: 100%;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease;
        }

        .music-card {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .music-pic-container {
            position: relative;
        }

        .music-pic {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin-active { animation: spin 4s linear infinite; }

        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background-color: #10b981;
            border-radius: 50%;
            border: 3px solid #121214;
        }

        .music-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .music-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
        }

        .pro-badge {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .crown-icon {
            color: #fbbf24;
            font-size: 14px;
        }

        .music-subtitle { font-size: 13px; color: #d4d4d8; font-weight: 500; }
        .music-song { font-size: 12px; color: #a1a1aa; display: flex; align-items: center; gap: 8px; }

        .music-wave { display: none; gap: 3px; height: 12px; align-items: flex-end; }
        .music-wave.active { display: flex; }
        .wave-bar { width: 3px; background-color: #7bb5d6; animation: bounce 1s infinite ease-in-out; border-radius: 2px; }
        .wave-bar:nth-child(1) { height: 100%; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 60%; animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { height: 80%; animation-delay: 0.4s; }
        @keyframes bounce { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            margin-bottom: 25px;
            color: #a1a1aa;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
        }

        .stat-item { display: flex; flex-direction: column; align-items: center; gap: 5px; transition: color 0.3s ease; }
        .stat-item i { font-size: 16px; color: #7bb5d6; }
        .stat-item:hover { color: #ffffff; }

        .link-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .link-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg); transition: 0.5s;
        }

        .link-card:hover::before { left: 150%; }
        .link-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); transform: scale(1.02); }

        .link-text h3 { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
        .link-text p { font-size: 12px; color: #a1a1aa; font-weight: 400; }
        .link-icon {
            color: #a1a1aa; font-size: 18px; background: rgba(255, 255, 255, 0.05);
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.3s ease;
        }
        .link-card:hover .link-icon { color: #ffffff; background: #7bb5d6; }
    </style>
</head>
<body>

    <!-- Audio MP3 (Tetap Menggunakan file Anda) -->
    <audio id="bgMusic" src="lagu.mp3" loop></audio>

    <!-- ==========================================
         LAYAR AWAL (OVERLAY TAP ANYWHERE)
         ========================================== -->
    <div id="welcomeOverlay">
        <div class="welcome-card">
            <!-- Ganti src foto.jpg dengan foto Anda -->
            <img src="foto.jpg" alt="Profile" class="welcome-pic">
            <h2 class="welcome-name">NONA RA</h2>
            <div class="welcome-tap">
                <span>&mdash;</span> TAP ANYWHERE <span>&mdash;</span>
            </div>
        </div>
    </div>

    <!-- ==========================================
         HALAMAN UTAMA (Diaktifkan lewat JavaScript)
         ========================================== -->
    <div id="mainContent" class="main-wrapper">
        
        <!-- Tombol Ikon Audio Atas -->
        <div class="top-right-icon animate-item delay-1" id="audioToggle">
            <!-- Icon di set ke Xmark karena audio diputar lewat klik layar depan -->
            <i class="fa-solid fa-volume-high" id="audioIcon"></i>
        </div>

        <div class="container">
            <!-- Bagian Profil -->
            <div class="profile-section animate-item delay-2">
                <img src="foto.jpg" alt="Profile" class="profile-pic-main">
                <h1 class="profile-name animate-text t-delay-1">NONA RA</h1>
                <p class="profile-desc animate-text t-delay-2">aplikasi premium by Nona Raa</p>
                
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="https://wa.me/6289505562584"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>

            <!-- Kartu Now Playing / Profil Mini -->
            <div class="glass-card music-card animate-item delay-3">
                <div class="music-pic-container">
                    <img src="foto.jpg" alt="Mini Profile" class="music-pic spin-active" id="musicDisc">
                    <div class="online-dot"></div>
                </div>
                <div class="music-info">
                    <div class="music-title-row animate-text t-delay-3">
                        Nona Ra
                        <span class="pro-badge">PRO+</span>
                        <i class="fa-solid fa-crown crown-icon"></i>
                    </div>
                    <div class="music-subtitle animate-text t-delay-4">Nona Ra</div>
                    <div class="music-song animate-text t-delay-5">
                        in another life
                        <div class="music-wave active" id="musicWave">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Statistik -->
            <div class="stats-row animate-item delay-4">
                <div class="stat-item"><i class="fa-regular fa-eye"></i> 15K+</div>
                <div class="stat-item"><i class="fa-solid fa-users"></i> 2.5K+</div>
                <div class="stat-item"><i class="fa-solid fa-star" style="color: #fbbf24;"></i> 4.9/5</div>
                <div class="stat-item"><i class="fa-solid fa-cart-shopping"></i> 10K+</div>
                <div class="stat-item"><i class="fa-solid fa-bolt" style="color: #fbbf24;"></i> 24/7</div>
            </div>

            <!-- Tombol Link 1 -->
            <a href="https://padlet.com/PremiumNona/priceless-apps-ip1le9h5urhtgd0z" class="glass-card link-card animate-item delay-5">
                <div class="link-text">
                    <h3 class="animate-text t-delay-6">🛒 Katalog Aplikasi Premium</h3>
                    <p class="animate-text t-delay-7">Pilih & order aplikasi kebutuhanmu di sini</p>
                </div>
                <div class="link-icon">
                    <i class="fa-solid fa-store"></i>
                </div>
            </a>

            <!-- Tombol Link 2 -->
            <a href="https://whatsapp.com/channel/0029Vb6XBmL6rsQlgcYat21N" class="glass-card link-card animate-item delay-6">
                <div class="link-text">
                    <h3 class="animate-text t-delay-8">⭐ Bukti Testimoni Nona Ra</h3>
                    <p class="animate-text t-delay-9">100% Trusted & Transaksi Bergaransi</p>
                </div>
                <div class="link-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </a>
        </div>
    </div>

    <!-- Script Logika Tap & Audio -->
    <script>
        const audio = document.getElementById('bgMusic');
        const overlay = document.getElementById('welcomeOverlay');
        const mainContent = document.getElementById('mainContent');
        const audioToggleBtn = document.getElementById('audioToggle');
        const audioIcon = document.getElementById('audioIcon');
        const musicDisc = document.getElementById('musicDisc');
        const musicWave = document.getElementById('musicWave');
        let isPlaying = false;

        // Saat layar Tap Anywhere di-klik
        overlay.addEventListener('click', () => {
            // 1. Play Musik
            audio.play().then(() => {
                isPlaying = true;
            }).catch(e => {
                console.log("Audio failed to play", e);
            });

            // 2. Hilangkan Overlay dengan animasi fade
            overlay.style.opacity = '0';
            
            // 3. Tunggu setengah detik (0.5s), lalu hapus overlay dan tampilkan layar utama
            setTimeout(() => {
                overlay.style.display = 'none';
                mainContent.style.display = 'flex'; // Animasi CSS akan otomatis mulai sekarang!
            }, 500);
        });

        // Tombol Pause/Play Audio di sudut kanan atas halaman utama
        audioToggleBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                audioIcon.classList.remove('fa-volume-high');
                audioIcon.classList.add('fa-volume-xmark');
                musicDisc.classList.remove('spin-active');
                musicWave.classList.remove('active');
            } else {
                audio.play();
                audioIcon.classList.remove('fa-volume-xmark');
                audioIcon.classList.add('fa-volume-high');
                musicDisc.classList.add('spin-active');
                musicWave.classList.add('active');
            }
            isPlaying = !isPlaying;
        });
    </script>
</body>
</html>
